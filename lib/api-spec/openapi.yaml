openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Inside Out Packaging Industries API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inquiries
    description: Product inquiry and quote request operations
  - name: pdf-downloads
    description: Gated website PDF downloads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inquiries:
    post:
      operationId: submitInquiry
      tags: [inquiries]
      summary: Submit a product inquiry or quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inquiries/quote:
    post:
      operationId: submitQuote
      tags: [inquiries]
      summary: Submit a request for quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote request submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pdf-downloads:
    post:
      operationId: requestPdfDownload
      tags: [pdf-downloads]
      summary: Record a visitor request and return the selected PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfDownloadRequest"
      responses:
        "200":
          description: The requested PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The requested document is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InquiryInput:
      type: object
      required:
        - name
        - email
        - phone
        - message
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type: ["string", "null"]
        product:
          type: ["string", "null"]
        message:
          type: string
          minLength: 5

    QuoteInput:
      type: object
      required:
        - name
        - email
        - phone
        - product
        - quantity
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type: ["string", "null"]
        product:
          type: string
        quantity:
          type: string
        specifications:
          type: ["string", "null"]
        message:
          type: ["string", "null"]

    PdfDownloadRequest:
      type: object
      required:
        - document
        - name
        - email
        - company
        - consent
      properties:
        document:
          type: string
          enum: [catalogue, company-profile]
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: string
          minLength: 2
          maxLength: 160
        consent:
          type: boolean
          enum: [true]

    InquiryResponse:
      type: object
      required:
        - id
        - success
        - message
      properties:
        id:
          type: integer
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
